name: Build Android APK & Bundle

# Controls when the workflow will run
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

  # Allows you to run this workflow manually from the Actions tab in your browser
  workflow_dispatch:

jobs:
  build:
    name: Build Android Project
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java Environment (Java 17 is standard for modern Jetpack Compose projects)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # Automatically caches Gradle downloads to speed up future runs

      # Step 3: Grant execution permissions to the Gradle Wrapper wrapper script
      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      # Step 4: Run Android Linter and Unit Tests (optional, but ensures code stability)
      # Uncomment the line below if you have unit tests written!
      # - name: Run Unit Tests
      #   run: ./gradlew test

      # Step 5: Compile the app into a Debug APK
      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      # Step 6: Compile the app into an Android App Bundle (AAB - for Play Store)
      - name: Build Release Bundle (AAB)
        run: ./gradlew bundleRelease

      # Step 7: Save the generated APK as a downloadable artifact in GitHub Actions
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaVault-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30 # Keeps your build on GitHub for up to 30 days

      # Step 8: Save the generated AAB as a downloadable artifact in GitHub Actions
      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaVault-Release-Bundle
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
