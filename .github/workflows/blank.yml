name: Build Android APK & Bundle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Project
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Dynamically locate the folder containing the gradlew file
      - name: Find Gradle Directory
        id: find_gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -print -quit)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: Could not find 'gradlew' wrapper file in this repository!"
            exit 1
          fi
          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew in directory: $GRADLE_DIR"
          echo "dir=$GRADLE_DIR" >> $GITHUB_OUTPUT

      # Step 3: Set up Java Environment
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Step 4: Grant execution permissions to gradlew in its dynamic directory
      - name: Make Gradle Wrapper Executable
        run: chmod +x "${{ steps.find_gradle.outputs.dir }}/gradlew"

      # Step 5: Compile the app into a Debug APK
      - name: Assemble Debug APK
        working-directory: ${{ steps.find_gradle.outputs.dir }}
        run: ./gradlew assembleDebug

      # Step 6: Locate and Save the generated APK
      - name: Locate and Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LuminaVault-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 30
